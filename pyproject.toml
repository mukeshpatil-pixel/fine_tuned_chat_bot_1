[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-report-bot"
version = "1.0.0"
description = "Industrial Sensor Telemetry Reporting Chatbot and Automated PDF Generation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "pymupdf>=1.24.0",
    "websockets>=12.0",
    "rich>=13.0.0",
    "flake8>=7.0.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | node_modules
  | tmp
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", "__pycache__", "node_modules", "tmp", ".venv"]
