name: CI & Code Linting Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. .NET 9 Backend Build, Code Audit & Format Check
  # ========================================================
  backend-ci:
    name: Backend (.NET 9) Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore ".net backend/SensorReportBot.sln"

      - name: Build Solution (Release)
        run: dotnet build ".net backend/SensorReportBot.sln" --configuration Release --no-restore

      - name: Enforce .NET Code Formatting & Style (.editorconfig)
        run: dotnet format ".net backend/SensorReportBot.sln" --verify-no-changes --verbosity normal

  # ========================================================
  # 2. React 19 Frontend Linting & Production Bundle Build
  # ========================================================
  frontend-ci:
    name: Frontend (React 19 / Vite) Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run JavaScript/JSX Linter (Oxlint)
        run: npm run lint

      - name: Build Production Assets (Vite)
        run: npm run build

  # ========================================================
  # 3. Python Scripts & Synthetic Generator Linting
  # ========================================================
  python-ci:
    name: Python Code Linting & Syntax Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flake8 Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Bytecode & Syntax Compilation Audit
        run: |
          python -m py_compile stress_test_chatbot_and_pdfs.py training/generate_dataset.py training/train_lora.py

      - name: Lint for Critical Code Defects (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --exclude=.git,__pycache__,node_modules,tmp,.venv,".net backend" --show-source --statistics

  # ========================================================
  # 4. Docker Compose & Microservice Stack Verification
  # ========================================================
  docker-validation:
    name: Docker Compose & Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
